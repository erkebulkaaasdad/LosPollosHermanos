<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>LosPollos — {{ _('login') }} / {{ _('register') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .location-fields { 
        display: none; 
        margin-top: 15px; 
        padding: 15px;
        background: rgba(0, 0, 0, 0.03);
        border-radius: 8px;
        border: 1px dashed var(--primary-color);
    }
    .kz-only { display: none; }
    .auth-tabs {
        display: flex;
        margin-bottom: 20px;
        border-bottom: 2px solid #eee;
    }
    .auth-tab {
        flex: 1;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        font-weight: bold;
        color: #888;
    }
    .auth-tab.active {
        color: var(--primary-color);
        border-bottom: 2px solid var(--primary-color);
    }
    select, input {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px; /* Prevent zoom on iOS */
        box-sizing: border-box;
    }
    .search-hint {
        font-size: 12px;
        color: #666;
        margin-bottom: 5px;
        display: block;
    }
  </style>
</head>
<body>

<header>
  <div class="lang-switcher">
    <a href="/set_lang/ru" class="lang-btn {{ 'active' if current_lang == 'ru' else '' }}">RU</a>
    <a href="/set_lang/kk" class="lang-btn {{ 'active' if current_lang == 'kk' else '' }}">KK</a>
  </div>
  <h1>LosPollos</h1>
  <p>{{ _('tagline') }}</p>
</header>

<div class="container">
  <div class="card" id="authCard">
    <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">{{ _('login') }}</div>
        <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">{{ _('register') }}</div>
    </div>
    
    <div id="basicFields">
        <label>{{ _('email_label') }}</label>
        <input type="email" id="email" placeholder="example@mail.com">
        
        <label>{{ _('password') }}</label>
        <input type="password" id="password" placeholder="******">
    </div>
    
    <div id="registerFields" class="location-fields">
      <h4 style="margin-top:0; color: var(--primary-color);">{{ _('location_data') }}</h4>
      
      <label>{{ _('country') }}</label>
      <span class="search-hint">{{ _('search_hint') }}</span>
      <input list="countriesList" id="country" placeholder="{{ _('select_country') }}" onchange="toggleKzFields()" oninput="toggleKzFields()">
      <datalist id="countriesList">
        {% for country in countries %}
        <option value="{{ country }}">
        {% endfor %}
      </datalist>

      <div id="kzFields" class="kz-only">
        <label>{{ _('region') }}</label>
        <select id="region" onchange="updateCities()">
          <option value="">-- {{ _('select_region') }} --</option>
          {% for region in kz_locations.keys() %}
          <option value="{{ region }}">{{ region }}</option>
          {% endfor %}
        </select>

        <label>{{ _('city') }}</label>
        <select id="city">
          <option value="">-- {{ _('select_city') }} --</option>
        </select>
      </div>
      
      <div id="otherCityField" style="display:none;">
        <label>{{ _('city') }}</label>
        <input type="text" id="otherCity" placeholder="{{ _('enter_city') }}">
      </div>
    </div>
    
    <div style="margin-top: 20px;">
        <button id="submitBtn" onclick="handleAuth()" style="width: 100%;">{{ _('login') }}</button>
    </div>
    
    <div id="message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>
</div>

<script>
  const kzLocations = {{ kz_locations|tojson }};
  let currentMode = 'login';

  function switchTab(mode) {
    currentMode = mode;
    const regFields = document.getElementById('registerFields');
    const submitBtn = document.getElementById('submitBtn');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const messageDiv = document.getElementById('message');

    messageDiv.innerText = "";

    if (mode === 'register') {
        regFields.style.display = 'block';
        submitBtn.innerText = "{{ _('register') }}";
        submitBtn.style.background = "var(--success-color)";
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
    } else {
        regFields.style.display = 'none';
        submitBtn.innerText = "{{ _('login') }}";
        submitBtn.style.background = "var(--primary-color)";
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
    }
  }

  function toggleKzFields() {
    const country = document.getElementById('country').value;
    const kzFields = document.getElementById('kzFields');
    const otherCityField = document.getElementById('otherCityField');
    
    if (country === "Казахстан") {
      kzFields.style.display = 'block';
      otherCityField.style.display = 'none';
    } else if (country !== "") {
      kzFields.style.display = 'none';
      otherCityField.style.display = 'block';
    } else {
      kzFields.style.display = 'none';
      otherCityField.style.display = 'none';
    }
  }

  function updateCities() {
    const region = document.getElementById('region').value;
    const citySelect = document.getElementById('city');
    
    citySelect.innerHTML = '<option value="">-- {{ _("select_city") }} --</option>';
    
    if (region && kzLocations[region]) {
      kzLocations[region].forEach(city => {
        citySelect.innerHTML += `<option value="${city}">${city}</option>`;
      });
    }
  }

  async function handleAuth() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    
    if (!email || !password) {
      alert("{{ _('fill_all') }}");
      return;
    }

    const payload = { email, password };
    
    if (currentMode === 'register') {
      payload.country = document.getElementById('country').value;
      if (payload.country === "Казахстан") {
        payload.region = document.getElementById('region').value;
        payload.city = document.getElementById('city').value;
      } else {
        payload.region = "Other";
        payload.city = document.getElementById('otherCity').value;
      }
      
      if (!payload.country || !payload.city) {
        alert("{{ _('fill_all') }}");
        return;
      }
    }

    const url = currentMode === 'login' ? '/login' : '/register';
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok) {
        if (currentMode === 'login') {
          window.location.href = '/client';
        } else {
          messageDiv.innerText = "{{ _('success_reg') }}";
          messageDiv.style.color = "var(--success-color)";
          switchTab('login');
        }
      } else {
        messageDiv.innerText = result.error || "{{ _('error') }}";
        messageDiv.style.color = "var(--danger-color)";
      }
    } catch (e) {
      alert("Error connecting to server");
    }
  }
</script>

</body>
</html>
