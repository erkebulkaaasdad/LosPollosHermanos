<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>LosPollosHermanos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .hidden { display: none; }
    .error { color: #ff4d4d; margin-top: 10px; font-weight: bold; }
    .success { color: #28a745; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .auth-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .auth-buttons button { flex: 1; }
  </style>
</head>
<body>

<header>
  <h1>LosPollosHermanos</h1>
  <p>Сообщай о проблемах — зарабатывай на их решении</p>
</header>

<div class="container">

  <div id="authScreen" class="card">
    <h2 id="authTitle">Вход / Регистрация</h2>
    <p>Войдите, чтобы сообщать о проблемах или выполнять задания.</p>
    <input id="email" placeholder="Email" type="email">
    <input id="password" type="password" placeholder="Пароль">
    <div class="auth-buttons">
        <button onclick="handleAuth('login')">Войти</button>
        <button onclick="handleAuth('register')" style="background: #28a745;">Регистрация</button>
    </div>
    <div id="message"></div>
  </div>

</div>

<script>
  async function handleAuth(type) {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const messageDiv = document.getElementById("message");
    
    if (!email || !password) {
        messageDiv.innerText = "Заполните все поля";
        messageDiv.className = "error";
        return;
    }

    const endpoint = type === 'login' ? '/login' : '/register';
    try {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (response.ok) {
            if (type === 'login') {
                window.location.href = '/client';
            } else {
                messageDiv.innerText = "Регистрация успешна! Теперь вы можете войти.";
                messageDiv.className = "success";
            }
        } else {
            messageDiv.innerText = result.error || "Ошибка";
            messageDiv.className = "error";
        }
    } catch (e) {
        messageDiv.innerText = "Ошибка соединения с сервером";
        messageDiv.className = "error";
    }
  }
</script>

</body>
</html>
