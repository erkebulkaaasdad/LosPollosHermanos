<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>LosPollos — {{ _('login') }} / {{ _('register') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .location-fields { display: none; margin-top: 10px; }
    .kz-only { display: none; }
  </style>
</head>
<body>

<header>
  <div class="lang-switcher">
    <a href="/set_lang/ru" class="lang-btn {{ 'active' if current_lang == 'ru' else '' }}">RU</a>
    <a href="/set_lang/kk" class="lang-btn {{ 'active' if current_lang == 'kk' else '' }}">KK</a>
  </div>
  <h1>LosPollos</h1>
  <p>{{ _('tagline') }}</p>
</header>

<div class="container">
  <div class="card" id="authCard">
    <h2 id="formTitle">{{ _('login') }} / {{ _('register') }}</h2>
    
    <label>Email</label>
    <input type="email" id="email" placeholder="example@mail.com">
    
    <label>Пароль</label>
    <input type="password" id="password" placeholder="******">
    
    <div id="registerFields" class="location-fields">
      <label>{{ _('country') }}</label>
      <select id="country" onchange="toggleKzFields()">
        <option value="">-- Выберите страну --</option>
        {% for country in countries %}
        <option value="{{ country }}">{{ country }}</option>
        {% endfor %}
      </select>

      <div id="kzFields" class="kz-only">
        <label>{{ _('region') }}</label>
        <select id="region" onchange="updateCities()">
          <option value="">-- Выберите область --</option>
          {% for region in kz_locations.keys() %}
          <option value="{{ region }}">{{ region }}</option>
          {% endfor %}
        </select>

        <label>{{ _('city') }}</label>
        <select id="city">
          <option value="">-- Сначала выберите область --</option>
        </select>
      </div>
      
      <div id="otherCityField" style="display:none;">
        <label>{{ _('city') }}</label>
        <input type="text" id="otherCity" placeholder="Введите ваш город">
      </div>
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button id="loginBtn" onclick="handleAuth('login')">{{ _('login') }}</button>
        <button id="regBtn" onclick="handleAuth('register')" style="background: var(--success-color);">{{ _('register') }}</button>
    </div>
    
    <div id="message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>
</div>

<script>
  const kzLocations = {{ kz_locations|tojson }};

  function toggleKzFields() {
    const country = document.getElementById('country').value;
    const kzFields = document.getElementById('kzFields');
    const otherCityField = document.getElementById('otherCityField');
    
    if (country === "Казахстан") {
      kzFields.style.display = 'block';
      otherCityField.style.display = 'none';
    } else if (country !== "") {
      kzFields.style.display = 'none';
      otherCityField.style.display = 'block';
    } else {
      kzFields.style.display = 'none';
      otherCityField.style.display = 'none';
    }
  }

  function updateCities() {
    const region = document.getElementById('region').value;
    const citySelect = document.getElementById('city');
    
    citySelect.innerHTML = '<option value="">-- Выберите город --</option>';
    
    if (region && kzLocations[region]) {
      kzLocations[region].forEach(city => {
        citySelect.innerHTML += `<option value="${city}">${city}</option>`;
      });
    }
  }

  async function handleAuth(type) {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    const regFields = document.getElementById('registerFields');

    if (type === 'register' && regFields.style.display === 'none') {
      regFields.style.display = 'block';
      messageDiv.innerText = "Пожалуйста, укажите ваше местоположение для регистрации";
      messageDiv.style.color = "var(--primary-color)";
      return;
    }
    
    if (!email || !password) {
      alert("Заполните все поля");
      return;
    }

    const payload = { email, password };
    if (type === 'register') {
      payload.country = document.getElementById('country').value;
      if (payload.country === "Казахстан") {
        payload.region = document.getElementById('region').value;
        payload.city = document.getElementById('city').value;
      } else {
        payload.region = "Other";
        payload.city = document.getElementById('otherCity').value;
      }
      
      if (!payload.country || !payload.city) {
        alert("Заполните данные о местоположении");
        return;
      }
    }

    const url = type === 'login' ? '/login' : '/register';
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok) {
        if (type === 'login') {
          window.location.href = '/client';
        } else {
          messageDiv.innerText = "Регистрация успешна! Теперь вы можете войти.";
          messageDiv.style.color = "var(--success-color)";
          regFields.style.display = 'none';
        }
      } else {
        messageDiv.innerText = result.error || "Ошибка";
        messageDiv.style.color = "var(--danger-color)";
      }
    } catch (e) {
      alert("Ошибка соединения с сервером");
    }
  }
</script>

</body>
</html>
