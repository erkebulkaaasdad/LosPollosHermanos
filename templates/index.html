<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>LosPollos — {{ _('login') }} / {{ _('register') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="lang-switcher">
    <a href="/set_lang/ru" class="lang-btn {{ 'active' if current_lang == 'ru' else '' }}">RU</a>
    <a href="/set_lang/kk" class="lang-btn {{ 'active' if current_lang == 'kk' else '' }}">KK</a>
  </div>
  <h1>LosPollos</h1>
  <p>{{ _('tagline') }}</p>
</header>

<div class="container">
  <div class="card" id="authCard">
    <h2 id="formTitle">{{ _('login') }} / {{ _('register') }}</h2>
    
    <label>Email</label>
    <input type="email" id="email" placeholder="example@mail.com">
    
    <label>Пароль</label>
    <input type="password" id="password" placeholder="******">
    
    <div style="display: flex; gap: 10px;">
        <button onclick="handleAuth('login')">{{ _('login') }}</button>
        <button onclick="handleAuth('register')" style="background: var(--success-color);">{{ _('register') }}</button>
    </div>
    
    <div id="message" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
  </div>
</div>

<script>
  async function handleAuth(type) {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    
    if (!email || !password) {
      alert("Заполните все поля");
      return;
    }

    const url = type === 'login' ? '/login' : '/register';
    
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();

      if (response.ok) {
        if (type === 'login') {
          window.location.href = '/client';
        } else {
          messageDiv.innerText = "Регистрация успешна! Теперь вы можете войти.";
          messageDiv.style.color = "var(--success-color)";
        }
      } else {
        messageDiv.innerText = result.error || "Ошибка";
        messageDiv.style.color = "var(--danger-color)";
      }
    } catch (e) {
      alert("Ошибка соединения с сервером");
    }
  }
</script>

</body>
</html>
