<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>LosPollos — {{ _('shop_title') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="lang-switcher">
    <a href="/set_lang/ru" class="lang-btn {{ 'active' if current_lang == 'ru' else '' }}">RU</a>
    <a href="/set_lang/kk" class="lang-btn {{ 'active' if current_lang == 'kk' else '' }}">KK</a>
  </div>
  <h1>{{ _('shop_title') }}</h1>
  <p>{{ _('shop_desc') }}</p>
  <div class="nav-links">
    <a href="/client" class="role-switch">{{ _('back_home') }}</a>
    <a href="/logout" class="logout-btn">{{ _('logout') }}</a>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="points-badge">{{ _('balance') }}: <span id="userPoints">{{ user.points }}</span> ₸</div>
    
    <h2>{{ _('available_items') }}</h2>
    <div class="shop-grid">
      {% for item in items %}
      <div class="shop-item">
        <div>
          <h3>{{ item.name }}</h3>
          <p>{{ item.description }}</p>
        </div>
        <div>
          <div class="price">{{ item.price }} ₸</div>
          <button onclick="buyItem({{ item.id }}, {{ item.price }})">{{ _('buy') }}</button>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<script>
  async function buyItem(itemId, price) {
    const pointsSpan = document.getElementById('userPoints');
    const currentPoints = parseInt(pointsSpan.innerText);
    if (currentPoints < price) {
        alert("Недостаточно средств!");
        return;
    }

    if (!confirm("Вы уверены?")) return;

    try {
        const response = await fetch('/buy_item', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId })
        });

        const result = await response.json();

        if (response.ok) {
            alert("Поздравляем с покупкой!");
            pointsSpan.innerText = result.points;
        } else {
            alert(result.error || "Ошибка");
        }
    } catch (e) {
        alert("Ошибка соединения");
    }
  }
</script>

</body>
</html>
