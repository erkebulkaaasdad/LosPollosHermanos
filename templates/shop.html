<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <title>LosPollos — {{ _('shop_title') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .shop-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      text-align: center;
      transition: transform 0.2s;
    }
    .shop-card:hover { transform: translateY(-5px); }
    .price-tag {
      font-size: 20px;
      color: var(--accent-color);
      font-weight: bold;
      margin: 10px 0;
      display: block;
    }
    .nav-links { margin-top: 15px; }
    .nav-links a { color: white; text-decoration: none; font-weight: bold; margin-right: 15px; font-size: 14px; }
    .role-switch { background: white; color: var(--primary-color); padding: 5px 15px; border-radius: 4px; }
    .logout-btn { background: rgba(0, 0, 0, 0.1); padding: 5px 15px; border-radius: 4px; }
    .points-badge {
      background: #fff9db;
      color: #856404;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="lang-switcher">
    <a href="/set_lang/ru" class="lang-btn {{ 'active' if current_lang == 'ru' else '' }}">RU</a>
    <a href="/set_lang/kk" class="lang-btn {{ 'active' if current_lang == 'kk' else '' }}">KK</a>
  </div>
  <h1>{{ _('shop_title') }}</h1>
  <p>{{ _('shop_desc') }}</p>
  <div class="nav-links">
    <a href="/client" class="role-switch">{{ _('back_home') }}</a>
    <a href="/logout" class="logout-btn">{{ _('logout') }}</a>
  </div>
</header>

<div class="container">
  <div class="card" style="text-align:center;">
    <div class="points-badge">{{ _('balance') }}: <span id="userPoints">{{ user.points }}</span> ₸</div>
    <h2>{{ _('available_items') }}</h2>
    
    <div class="shop-grid">
      {% for item in items %}
      <div class="shop-card">
        <h3>{{ _(item.name) }}</h3>
        <p>{{ _(item.desc) }}</p>
        <span class="price-tag">{{ item.price }} ₸</span>
        <button onclick="buyItem({{ item.id }})">{{ _('buy') }}</button>
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<script>
  async function buyItem(id) {
    if (!confirm("{{ 'Вы уверены?' if current_lang == 'ru' else 'Сенімдісіз бе?' }}")) return;

    try {
      const response = await fetch(`/buy_item/${id}`, { method: 'POST' });
      const result = await response.json();
      
      if (response.ok) {
        alert("{{ 'Поздравляем с покупкой!' if current_lang == 'ru' else 'Сатып алуыңызбен құттықтаймыз!' }}");
        window.location.reload();
      } else {
        alert(result.error);
      }
    } catch (e) {
      alert("Error connecting to server");
    }
  }
</script>

</body>
</html>
